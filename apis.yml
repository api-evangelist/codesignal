aid: codesignal
name: Codesignal
description: >-
  CodeSignal is a technical interview and skills-assessment platform used by
  companies to screen, interview, and upskill software engineers. Its developer
  surface includes a GraphQL API (companies, tests, test sessions, interviews,
  and interview templates), a versioned Learn REST API (OpenAPI 3.1) for
  organization members, skill sets, and learning progress, a webhook event API
  covering assessment, candidate, auditor, and live-interview workflows with
  HMAC-SHA256 signed deliveries, and an official remote MCP server that lets AI
  agents work with assessments, candidate sessions, and interviews. CodeSignal is
  backed by Menlo Ventures.
